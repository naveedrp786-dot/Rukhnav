<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Management | RUKHNAV Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f9;
      color: #263238;
    }
    header {
      background: #173e36;
      color: white;
      padding: 20px 28px;
    }
    header h1 { margin: 0; font-size: 24px; }
    header p { margin-bottom: 0; opacity: .85; }
    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 18px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
    }
    section {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 3px 15px #0000000d;
    }
    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5d9;
      border-radius: 7px;
      font: inherit;
    }
    textarea { resize: vertical; }
    button {
      padding: 11px 17px;
      border: 0;
      border-radius: 7px;
      background: #176b55;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary { background: #50616a; }
    button:disabled { opacity: .55; cursor: wait; }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .article {
      border-bottom: 1px solid #e1e5e7;
      padding: 14px 0;
    }
    .article strong { display: block; }
    .article small {
      display: block;
      color: #607078;
      margin: 6px 0;
    }
    .article button { font-size: 12px; padding: 7px 11px; }
    #message { margin-top: 14px; min-height: 20px; }
    @media(max-width: 780px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <header>
    <h1>RUKHNAV Blog Management</h1>
    <p>Beauty articles, haircare guides and SEO content</p>
  </header>

  <main>
    <section>
      <h2>Create Article</h2>

      <form id="articleForm">
        <label for="title">Article Title</label>
        <input id="title" maxlength="220" required>

        <label for="slug">URL Slug</label>
        <input id="slug" maxlength="240"
               pattern="[a-z0-9]+(-[a-z0-9]+)*" required>

        <label for="excerpt">Summary</label>
        <textarea id="excerpt" rows="3" maxlength="5000"></textarea>

        <label for="content">Article Content</label>
        <textarea id="content" rows="16" required></textarea>

        <div class="actions">
          <button type="submit" id="saveBtn">Save Draft</button>
          <button type="button" class="secondary" id="clearBtn">
            Clear
          </button>
        </div>

        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section>
      <h2>Articles</h2>
      <button type="button" id="refreshBtn" class="secondary">
        Refresh List
      </button>
      <div id="articleList">Loading...</div>
    </section>
  </main>

  <script src="/admin/js/adminLayout.js"></script>
  <script src="/admin/js/blog-management.js"></script>
</body>
</html>
