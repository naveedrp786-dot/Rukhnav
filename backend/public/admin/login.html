<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>RUKHNAV ERP | Admin Login</title>

    <link
        rel="stylesheet"
        href="css/login.css">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo-section">

            <img
                src="images/logo.png"
                alt="RUKHNAV Logo"
                class="logo">

            <h1>RUKHNAV ERP</h1>

            <p>Admin Control Panel</p>

        </div>

        <form id="loginForm">

            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                    <button
                        type="button"
                        id="togglePassword">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>

            <div class="login-options">

                <label>

                    <input
                        type="checkbox"
                        id="rememberMe">

                    Remember Me

                </label>

                <a href="#">

                    Forgot Password?

                </a>

            </div>

            <button
                type="submit"
                class="login-btn">

                <span id="btnText">

                    Login

                </span>

                <span
                    id="loader"
                    class="loader hidden">

                </span>

            </button>

            <p
                id="errorMessage"
                class="error-message">

            </p>

        </form>

    </div>

</div>


<script src="js/login.js"></script>

</body>

</html>
