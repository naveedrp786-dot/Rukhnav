<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chart of Accounts | RUKHNAV ERP</title><link rel="stylesheet" href="/admin/css/erp.css"><link rel="stylesheet" href="/admin/css/finance-part2.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"></head><body><div class="dashboard"><div id="sidebar-container"></div><main class="main"><div id="topbar-container"></div>
<section class="content f2-page">
<header class="f2-hero"><div><small>FINANCE STRUCTURE</small><h1>Chart of Accounts</h1><p>Manage the accounting account structure used by journals and ledgers.</p></div><div class="f2-actions"><a class="f2-btn light" href="/admin/finance.html">Finance Dashboard</a><button id="newAccount" class="f2-btn gold">New Account</button></div></header>
<div id="accMsg" class="f2-msg"></div>
<section class="f2-panel"><h2>Account Register</h2><p>Control accounts cannot receive direct journal postings.</p>
<form id="accFilter" class="f2-filter"><label class="f2-field"><span>Search</span><input id="accSearch"></label><label class="f2-field"><span>Type</span><select id="accType"><option value="">All</option><option>Asset</option><option>Liability</option><option>Equity</option><option>Revenue</option><option>Expense</option></select></label><label class="f2-field"><span>Status</span><select id="accStatus"><option value="">All</option><option>Active</option><option>Inactive</option></select></label><button class="f2-btn gold">Apply</button></form>
<div class="f2-table-wrap"><table class="f2-table"><thead><tr><th>Code</th><th>Account</th><th>Type</th><th>Parent</th><th>Normal</th><th>Posting</th><th>Balance</th><th>Status</th></tr></thead><tbody id="accBody"><tr><td colspan="8">Loading...</td></tr></tbody></table></div></section></section>
<div id="accModal" class="f2-modal hidden"><div class="f2-backdrop" data-close="accModal"></div><div class="f2-dialog"><div class="f2-head"><h2>Create Accounting Account</h2><button data-close="accModal">×</button></div><form id="accForm"><div class="f2-body f2-grid"><label class="f2-field"><span>Code</span><input id="newCode" required></label><label class="f2-field"><span>Name</span><input id="newName" required></label><label class="f2-field"><span>Type</span><select id="newType"><option>Asset</option><option>Liability</option><option>Equity</option><option>Revenue</option><option>Expense</option></select></label><label class="f2-field"><span>Parent</span><select id="newParent"><option value="">No parent</option></select></label><label class="f2-field full"><span>Description</span><textarea id="newDesc"></textarea></label><label class="full"><input id="newPosting" type="checkbox" checked> Allow direct posting</label></div><div class="f2-foot"><button type="button" class="f2-btn light" data-close="accModal">Cancel</button><button class="f2-btn gold">Create</button></div></form></div></div>
<div id="footer-container"></div></main></div><script src="/admin/js/componentLoader.js"></script><script src="/admin/js/adminLayout.js"></script><script src="/admin/js/finance-part2-common.js"></script><script src="/admin/js/finance-accounts.js"></script></body></html>
