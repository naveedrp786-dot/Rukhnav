<link rel="stylesheet" href="/admin/css/topbar-unified.css">
<header class="rukhnav-topbar" role="banner">
    <div class="rukhnav-topbar__page">
        <h1 id="pageTitle">Dashboard</h1>
    </div>

    <div class="rukhnav-topbar__tools">
        <label class="rukhnav-topbar__search" aria-label="Search ERP">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="adminGlobalSearch" type="search" placeholder="Search..." autocomplete="off">
        </label>

        <button class="rukhnav-topbar__icon" type="button" id="adminNotificationsButton" aria-label="Notifications">
            <i class="fa-solid fa-bell"></i>
        </button>

        <div class="rukhnav-topbar__profile" aria-label="Signed in administrator">
            <img id="adminImage" src="/admin/images/default-user.png" alt="Administrator">
            <div>
                <strong id="adminName">Administrator</strong>
                <span id="adminRole">Admin</span>
            </div>
        </div>
    </div>
</header>
