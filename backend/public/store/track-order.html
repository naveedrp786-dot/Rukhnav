<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Track Order | RUKHNAV</title>

<meta
    name="description"
    content="Track your RUKHNAV order using your order number and email or mobile number."
>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
>

<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/store.css?v=20260902-category-icons-1">
<link rel="stylesheet" href="css/track-order.css?v=20260901-1">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/mobile-storefront.css?v=20260902-mobile-header-1">
    <link rel="stylesheet" href="/store/css/cms-text-colors.css?v=20260902-text-colour-final-1">
<link rel="stylesheet" href="css/commerce-shell.css?v=20260903-compact-mobile-header-1">
    <link rel="stylesheet" href="css/rukhnav-global-shell.css?v=20260903-four-actions-2">
</head>

<body>

<div id="announcement"></div>
<div id="header"></div>

<main class="public-tracking-page">

    <section class="tracking-intro">

        <span class="tracking-eyebrow">
            <i class="fa-solid fa-truck-fast"></i>
            ORDER TRACKING
        </span>

        <h1>Track your order</h1>

        <p>
            No account or sign-in is required. Enter your order
            number and the email address or mobile number used
            when placing the order.
        </p>

    </section>


    <section class="tracking-search-card">

        <form id="trackingForm">

            <div class="tracking-field">
                <label for="trackingOrderNumber">
                    Order Number
                </label>

                <input
                    id="trackingOrderNumber"
                    type="text"
                    autocomplete="off"
                    placeholder="e.g. RUK-20260806-000011"
                    required
                >
            </div>

            <div class="tracking-field">
                <label for="trackingIdentifier">
                    Email or Mobile Number
                </label>

                <input
                    id="trackingIdentifier"
                    type="text"
                    autocomplete="email"
                    placeholder="Email address or mobile number"
                    required
                >
            </div>

            <button
                id="trackingSubmit"
                type="submit"
                class="tracking-submit"
            >
                <i class="fa-solid fa-magnifying-glass"></i>
                Track Order
            </button>

        </form>

        <div
            id="trackingMessage"
            class="tracking-message hidden"
            role="alert"
        ></div>

    </section>


    <section
        id="trackingResult"
        class="tracking-result hidden"
    ></section>

</main>

<div id="footer"></div>
<div id="toast" class="toast-region"></div>
<div id="overlay" class="overlay"></div>

<script src="js/api.js"></script>
<script src="js/theme.js"></script>
<script src="js/components.js?v=20260903-four-actions-2"></script><script src="js/customer-notifications.js?v=20260901-notification-reader-1"></script>
<script src="js/store.js?v=20260902-category-icons-1"></script>
<script src="js/track-order.js?v=20260901-2"></script>
<script src="js/demo-visuals.js?v=20260827-2"></script>


<script src="js/website-cms-bridge.js?v=20260901-theme-v9-final20-1"></script>
</body>
</html>
