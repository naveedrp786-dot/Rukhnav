<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | RUKHNAV</title>
<meta name="description" content="Reset your RUKHNAV customer password securely.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/store.css?v=20260901-notification-reader-1">
<link rel="stylesheet" href="css/account-recovery.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/mobile-storefront.css?v=20260902-mobile-layout-ticker-1">
    <link rel="stylesheet" href="/store/css/cms-text-colors.css?v=20260902-text-colour-final-1">
</head>
<body>
<div id="announcement"></div>
<div id="header"></div>

<main class="reset-page">
    <section class="reset-card">
        <a href="account.html" class="reset-back-link">
            <i class="fa-solid fa-arrow-left"></i>
            Back to sign in
        </a>

        <div class="reset-icon">
            <i class="fa-solid fa-key"></i>
        </div>

        <span>Secure Account Recovery</span>
        <h1>Reset your password</h1>
        <p id="resetIntro">
            Enter the six-digit code sent to your registered email address or mobile number.
        </p>

        <div id="resetMessage" class="reset-message" aria-live="polite"></div>

        <form id="resetPasswordForm">
            <label for="resetIdentifier">Email or mobile number</label>
            <div class="recovery-input">
                <i class="fa-regular fa-user"></i>
                <input id="resetIdentifier" type="text" autocomplete="username" required>
            </div>

            <label>Six-digit reset code</label>
            <div id="otpFields" class="otp-fields">
                <input inputmode="numeric" maxlength="1" aria-label="Digit 1">
                <input inputmode="numeric" maxlength="1" aria-label="Digit 2">
                <input inputmode="numeric" maxlength="1" aria-label="Digit 3">
                <input inputmode="numeric" maxlength="1" aria-label="Digit 4">
                <input inputmode="numeric" maxlength="1" aria-label="Digit 5">
                <input inputmode="numeric" maxlength="1" aria-label="Digit 6">
            </div>

            <div class="resend-row">
                <span id="codeExpiryText">Code expires soon.</span>
                <button id="resendCodeButton" type="button" class="recovery-link" disabled>
                    Resend in <span id="resendCountdown">60</span>s
                </button>
            </div>

            <label for="newPassword">New password</label>
            <div class="recovery-input password-input">
                <i class="fa-solid fa-lock"></i>
                <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
                <button type="button" data-password-toggle="newPassword"><i class="fa-regular fa-eye"></i></button>
            </div>

            <div class="password-strength">
                <div><span id="passwordStrengthBar"></span></div>
                <small id="passwordStrengthText">Use at least 8 characters.</small>
            </div>

            <label for="confirmNewPassword">Confirm new password</label>
            <div class="recovery-input password-input">
                <i class="fa-solid fa-lock"></i>
                <input id="confirmNewPassword" type="password" minlength="8" autocomplete="new-password" required>
                <button type="button" data-password-toggle="confirmNewPassword"><i class="fa-regular fa-eye"></i></button>
            </div>

            <button id="resetPasswordButton" type="submit" class="btn primary reset-submit">
                Reset password
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </section>
</main>

<div id="footer"></div>
<div id="toast" class="toast-region"></div>
<div id="overlay" class="overlay"></div>

<script src="js/api.js"></script>
<script src="js/theme.js"></script>
<script src="js/components.js?v=20260901-notifications-1"></script><script src="js/customer-notifications.js?v=20260901-notification-reader-1"></script>
<script src="js/store.js"></script>
<script src="js/reset-password.js"></script>
<script src="js/demo-visuals.js?v=20260827-2"></script>

<script src="js/website-cms-bridge.js?v=20260901-theme-v9-final20-1"></script>
</body>
</html>
