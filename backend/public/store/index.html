<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUKHNAV</title>
<meta name="description" content="RUKHNAV natural cosmetics and hair-care products.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/store.css?v=20260823-2"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="announcement"></div><div id="header"></div>
<main class="marketplace-home">

    <!-- =====================================================
         QUICK SHOP
         Compact shortcuts — no long descriptions.
         Existing Store.renderHomepageCategories() can still
         replace these with live ERP categories.
         ===================================================== -->
    <section class="home-shop-shortcuts">
        <div class="home-section-title">
            <h2>Shop</h2>

            <a href="products.html">
                See all
            </a>
        </div>

        <div class="categories">
            <a href="products.html?category=Hair%20Care">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <b>Hair Care</b>
            </a>

            <a href="products.html?category=Skin%20Care">
                <i class="fa-solid fa-droplet"></i>
                <b>Skin Care</b>
            </a>

            <a href="products.html?category=Herbal">
                <i class="fa-solid fa-leaf"></i>
                <b>Herbal</b>
            </a>

            <a href="products.html?sort=newest">
                <i class="fa-solid fa-sparkles"></i>
                <b>New Arrivals</b>
            </a>
        </div>
    </section>


    <!-- =====================================================
         PRODUCTS — PRIMARY HOMEPAGE CONTENT
         ===================================================== -->
    <section class="home-products-section">

        <div class="home-section-title">
            <h2>Products</h2>

            <a href="products.html">
                See all
                <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>

        <div id="homeLoading" class="state">
            <div class="spinner"></div>
            <p>Loading products</p>
        </div>

        <div id="homeEmpty" class="state hidden">
            <i class="fa-solid fa-box-open"></i>
            <h3>No products available</h3>
        </div>

        <div id="homeProducts"
             class="products hidden">
        </div>

    </section>

</main>
<div id="footer"></div><div id="toast" class="toast-region"></div><div id="overlay" class="overlay"></div>
<script src="js/api.js"></script><script src="js/theme.js"></script><script src="js/components.js?v=20260823-2"></script><script src="js/store.js"></script><script src="js/home.js"></script><script src="js/website-cms-bridge.js"></script>
</body></html>
