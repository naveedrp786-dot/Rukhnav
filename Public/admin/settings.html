<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings | RUKHNAV ERP</title><link rel="stylesheet" href="css/erp.css"><link rel="stylesheet" href="css/settings.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><div class="dashboard"><div id="sidebar-container"></div><main class="main"><div id="topbar-container"></div><section class="content settings-page"><header><span>Configuration</span><h1>System Settings</h1><p>Manage company information, your admin profile and account security.</p></header><div id="settingsMessage" class="settings-message"></div><nav class="settings-tabs"><button class="active" data-tab="company"><i class="fa-solid fa-building"></i> Company</button><button data-tab="profile"><i class="fa-solid fa-user-gear"></i> My Profile</button><button data-tab="security"><i class="fa-solid fa-shield-halved"></i> Security</button></nav><section id="company" class="settings-card tab-panel"><div class="card-heading"><div><span>Business Profile</span><h2>Company Information</h2></div></div><form id="companyForm" class="form-grid"><label>Company Name<input id="company_name" required></label><label>Tagline<input id="company_tagline"></label><label>Email<input id="company_email" type="email"></label><label>Phone<input id="company_phone"></label><label>Website<input id="website"></label><label>City<input id="city"></label><label>Province<input id="province"></label><label>Country<input id="country"></label><label>Postal Code<input id="postal_code"></label><label>NTN<input id="ntn"></label><label>STRN<input id="strn"></label><label>Currency<input id="currency" value="PKR"></label><label>Invoice Prefix<input id="invoice_prefix" value="INV"></label><label class="wide">Address<textarea id="address" rows="4"></textarea></label><div class="wide actions"><button class="primary-btn"><i class="fa-solid fa-floppy-disk"></i> Save Company Settings</button></div></form></section><section id="profile" class="settings-card tab-panel hidden"><div class="card-heading"><div><span>Administrator</span><h2>My Profile</h2></div></div><form id="profileForm" class="form-grid"><label>Full Name<input id="full_name" required></label><label>Email<input id="profile_email" disabled></label><label>Phone<input id="phone"></label><label>Role<input id="role" disabled></label><label>Status<input id="profile_status" disabled></label><div class="wide actions"><button class="primary-btn"><i class="fa-solid fa-user-check"></i> Update Profile</button></div></form></section><section id="security" class="settings-card tab-panel hidden"><div class="card-heading"><div><span>Account Security</span><h2>Change Password</h2></div></div><form id="passwordForm" class="form-grid security-grid"><label>Current Password<input id="currentPassword" type="password" required></label><label>New Password<input id="newPassword" type="password" minlength="8" required></label><label>Confirm New Password<input id="confirmPassword" type="password" minlength="8" required></label><div class="wide actions"><button class="primary-btn"><i class="fa-solid fa-key"></i> Change Password</button></div></form></section></section><div id="footer-container"></div></main></div><script src="/admin/js/componentLoader.js"></script>
<script src="js/settings.js"></script>
<script src="/admin/js/adminLayout.js"></script>
</body></html>
